name: pinhuivalve

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: pinhuivalve:latest
    container_name: pinhuivalve
    ports:
      # 默认映射到宿主机 80；如需换端口：WEB_PORT=8080 docker compose up -d
      - "${WEB_PORT:-80}:80"
    volumes:
      # 访问日志 / 错误日志落盘到宿主机 ./logs
      - ./logs:/var/log/nginx
      # 日志页可选密码（默认留空 = 不鉴权，所有 IP 可访问 /logs）
      - ./deploy/logs-auth.conf:/etc/nginx/logs-auth.conf:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # 让容器在“只读根文件系统”加固环境里也能启动（nginx pid/临时文件写 /tmp）
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
