# 完整 nginx 主配置（覆盖镜像自带的 /etc/nginx/nginx.conf）
# 日志：/var/log/nginx/access.log、error.log 同时写文件与 stdout
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
# pid 不放 /var/run：部分加固主机 / 只读根文件系统下该路径不可写，
# 会报 pwrite() "/var/run/nginx.pid" failed (1: Operation not permitted)
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    # 结构化访问日志：时间 / 请求 / 状态码 / 大小 / 耗时 / 来源 / UA
    log_format  pinhui  '$remote_addr - [$time_iso8601] "$request" $status '
                        '$body_bytes_sent ${request_time}s "$http_referer" "$http_user_agent"'
                        ' xff=$http_x_forwarded_for';

    # ① 落盘（宿主机 ./logs 挂载进来）② 输出到容器 stdout，docker compose logs 可见
    access_log  /var/log/nginx/access.log  pinhui  buffer=16k flush=1s;
    access_log  /dev/stdout                pinhui;

    # 临时目录同样放 /tmp，避免根文件系统只读时 mkdir 失败
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ---------- 日志查看 ----------
        # 页面：/logs   （静态查看器，读取 /logs/access.log）
        location = /logs {
            alias /usr/share/nginx/logs-viewer/index.html;
            default_type text/html;
            add_header Cache-Control "no-store";
        }

        # 原始日志：/logs/access.log、/logs/error.log
        # 按需求对全部 IP 开放（不限来源）。如需收紧，在 deploy/logs-auth.conf 里启用 Basic 认证，
        # 或在本 location 内加：allow 10.0.0.0/8; allow 192.168.0.0/16; deny all;
        location /logs/ {
            alias /var/log/nginx/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "no-store";

            # 可选：Basic 认证。默认留空 = 不鉴权；填两行即生效
            include /etc/nginx/logs-auth.conf;
        }

        # ---------- 静态资源 ----------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /images/ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ---------- SPA history 路由回退 ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
