# 宿主机（非容器）Nginx 站点配置
# 用法：
#   sudo mkdir -p /var/www/pinhuivalve /var/www/pinhuivalve-logs /var/log/pinhuivalve
#   sudo rsync -a dist/ /var/www/pinhuivalve/
#   sudo cp deploy/logs-viewer.html /var/www/pinhuivalve-logs/index.html
#   sudo cp deploy/nginx-site.conf /etc/nginx/conf.d/pinhuivalve.conf
#   sudo nginx -t && sudo systemctl reload nginx

log_format pinhui '$remote_addr - [$time_iso8601] "$request" $status '
                  '$body_bytes_sent ${request_time}s "$http_referer" "$http_user_agent"'
                  ' xff=$http_x_forwarded_for';

server {
    listen 80;
    server_name _;                        # 改成你的域名，如 www.example.com

    root /var/www/pinhuivalve;            # 指向 dist 内容所在目录
    index index.html;

    charset utf-8;
    server_tokens off;

    access_log /var/log/pinhuivalve/access.log pinhui;
    error_log  /var/log/pinhuivalve/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---------- 日志查看（对全部 IP 开放，如需收紧见 deploy/logs-auth.conf） ----------
    location = /logs {
        alias /var/www/pinhuivalve-logs/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location /logs/ {
        alias /var/log/pinhuivalve/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        default_type text/plain;
        add_header Cache-Control "no-store";
        # 可选 Basic 认证：把 deploy/logs-auth.conf 里的两行放开并指向 htpasswd 文件
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 500 502 503 504 /50x.html;
}
